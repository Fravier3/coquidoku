name: Publicar Coquidoku
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: coquidoku-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verificar juego
        run: |
          node --check app.js
          node --check variants.js
          node --check sw.js
          node tests/game.test.cjs
          node tests/variants.test.cjs
          node tests/audio.test.cjs
          python3 tests/validate.py
      - name: Preparar archivos públicos
        run: |
          mkdir -p _site
          cp index.html app.js variants.js styles.css sw.js puzzles.json manifest.webmanifest _site/
          cp -R assets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
